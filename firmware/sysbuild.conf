# Build the application as a sysbuild child image with MCUboot as the
# immutable bootloader. MCUboot occupies the start of RRAM and owns two
# application slots plus swap-trailer bookkeeping; every `west build` of this
# app therefore also builds the bootloader and emits merged.hex and
# dfu_application.zip.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
