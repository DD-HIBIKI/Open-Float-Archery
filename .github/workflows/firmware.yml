name: Firmware

# The NCS workspace fetch is heavy (~10 GB, 15+ minutes), so this workflow only
# runs when firmware, its host checks, or this file changes, or on manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/verify_ble_uuids.py"
      - "tools/verify_trace_storage.py"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/verify_ble_uuids.py"
      - "tools/verify_trace_storage.py"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    name: Zephyr build (xiao_nrf54l15, NCS v3.3.0)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.3.0
    defaults:
      run:
        # Toolchain environment variables are only set in bash sessions.
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: openfloat

      - name: Initialize NCS v3.3.0 workspace
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.3.0 ncs
          cd ncs
          west update -o=--depth=1 -n

      # Build the freestanding app out-of-tree from inside the west workspace.
      # NCS v3.3.0 ships the xiao_nrf54l15 board, so no BOARD_ROOT is needed
      # (passing one fails the build; see firmware/BUILDING.md).
      - name: Stamp build version
        working-directory: openfloat
        run: |
          # MCUboot reports this as the image version, so each build is
          # distinguishable from the one it replaced.
          sed -i -E "s/^VERSION_TWEAK = .*/VERSION_TWEAK = ${GITHUB_RUN_NUMBER}/" firmware/VERSION
          cat firmware/VERSION

      - name: Build firmware
        working-directory: ncs
        run: |
          west build -p always -b xiao_nrf54l15/nrf54l15/cpuapp \
            -d "$GITHUB_WORKSPACE/openfloat/firmware/build-ci" \
            "$GITHUB_WORKSPACE/openfloat/firmware"

      - name: Dump partition map
        working-directory: openfloat
        run: |
          cd firmware/build-ci
          for f in partitions.yml partition_manager_output.cmake pm.config zephyr/partitions.h; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
          echo "===== images ====="
          ls -l merged.hex

      - name: Verify MCUboot + mcumgr configuration
        working-directory: openfloat
        run: |
          cd firmware/build-ci
          echo "=== OTA symbols in the application image ==="
          grep -E '^CONFIG_(MCUMGR|MCUMGR_TRANSPORT_BT|MCUMGR_GRP_IMG|MCUMGR_GRP_OS|MCUBOOT_IMG_MANAGER|IMG_MANAGER|ZCBOR|NET_BUF|BOOTLOADER_MCUBOOT)=' firmware/zephyr/.config || true
          for symbol in CONFIG_MCUMGR CONFIG_MCUMGR_TRANSPORT_BT CONFIG_MCUBOOT_IMG_MANAGER CONFIG_BOOTLOADER_MCUBOOT; do
            if grep -q "^${symbol}=y" firmware/zephyr/.config; then
              echo "OK: ${symbol}=y"
            else
              echo "::error::${symbol} is not enabled; OTA would silently not work"
              exit 1
            fi
          done
          echo "=== artifacts ==="
          ls -l merged.hex dfu_application.zip firmware/zephyr/zephyr.signed.bin

      - name: Verify compiled BLE UUIDs
        working-directory: openfloat
        run: python3 tools/verify_ble_uuids.py firmware/build-ci/firmware/zephyr/zephyr.elf

      - name: Verify SDK storage capacity and save/startup recovery
        working-directory: openfloat
        run: python3 tools/verify_trace_storage.py --zephyr ../ncs/zephyr --cc cc

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openfloat-merged-hex
          path: |
            openfloat/firmware/build-ci/merged.hex
            openfloat/firmware/build-ci/dfu_application.zip
            openfloat/firmware/build-ci/firmware/zephyr/zephyr.signed.bin
          if-no-files-found: error
